<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمّ | الموظفين</title><style>body{background:#111;color:#fff;font:16px system-ui}main{max-width:700px;margin:auto;padding:20px}section{background:#222;padding:18px;border-radius:12px;margin:12px 0}button,input{box-sizing:border-box;width:100%;padding:12px;margin:6px 0;font:inherit;border-radius:8px}button{background:#d4af37;border:0}a,h1{color:#d4af37}[hidden]{display:none!important}</style><main><h1>تمّ | الموظفين</h1><p id="msg" role="status"></p><section id="auth"><a href="account.html">إنشاء حساب</a><form id="login"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="pass" type="password" placeholder="كلمة المرور" required><button>دخول</button></form></section><section id="panel" hidden><button id="logout">خروج</button><p id="state"></p><button id="apply" hidden>طلب الانضمام للتسويق</button><section id="employeeInfo" hidden><h2 id="employeeTitle">حساب الموظف</h2><p id="employeeNote"></p><a id="adminHome" href="admin.html" hidden>فتح لوحة الإدارة</a></section><div id="marketing" hidden><h2>رابط التسويق</h2><input id="link" readonly><button id="copy">نسخ الرابط</button><h2>العمولات المسجلة</h2><p id="total"></p><p>الرصيد المتاح يحسب بعد خصم طلبات السحب المعلقة والتحويلات المسجلة.</p><form id="withdraw"><input id="amount" type="number" min=".001" step=".001" placeholder="المبلغ بالدينار" required><input id="alias" maxlength="100" placeholder="اسم CliQ" required><button>طلب سحب</button></form><h2>طلبات السحب</h2><ul id="history"></ul></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9'),$=id=>document.getElementById(id),say=t=>$('msg').textContent=t;let user;async function load(){const{data:{session},error:sessionError}=await db.auth.getSession();if(sessionError)return say(sessionError.message);user=session?.user;$('auth').hidden=!!user;$('panel').hidden=!user;$('marketing').hidden=true;$('apply').hidden=true;$('employeeInfo').hidden=true;if(!user)return;const roleResult=await db.from('staff_roles').select('role').eq('user_id',user.id).maybeSingle();if(roleResult.error)return say(roleResult.error.message);if(roleResult.data&&roleResult.data.role!=='marketer'){$('employeeInfo').hidden=false;$('employeeTitle').textContent=({admin:'المدير العام',support:'موظف خدمة العملاء'}[roleResult.data.role]||'موظف تمّ');$('employeeNote').textContent=roleResult.data.role==='admin'?'حسابك يملك صلاحية الإدارة.':'تم تفعيل حساب الموظف. ستظهر هنا أدوات القسم عند إتاحتها.';$('adminHome').hidden=roleResult.data.role!=='admin';$('state').textContent='الحساب مفعّل';return;}const m=await db.from('marketers').select('*').eq('user_id',user.id).maybeSingle();if(m.error)return say(m.error.message);if(!m.data){const a=await db.from('staff_applications').select('status').eq('user_id',user.id).maybeSingle();if(a.error)return say(a.error.message);$('state').textContent=a.data?'حالة الطلب: '+a.data.status:'انضم إلى فريق التسويق';$('apply').hidden=!!a.data;return;}$('state').textContent=m.data.active?'مسوق نشط':'مسوق موقوف';$('marketing').hidden=!m.data.active;$('link').value=location.origin+'/?ref='+encodeURIComponent(m.data.referral_code);const c=await db.from('commissions').select('amount_fils').eq('marketer_id',user.id);if(c.error)return say(c.error.message);const earned=c.data.reduce((a,b)=>a+b.amount_fils,0);const w=await db.from('withdrawals').select('amount_fils,status').eq('user_id',user.id).order('created_at',{ascending:false});if(w.error)return say(w.error.message);const used=w.data.filter(x=>['pending','paid'].includes(x.status)).reduce((a,b)=>a+b.amount_fils,0);$('total').textContent='إجمالي العمولات: '+(earned/1000).toFixed(3)+' د.أ — المتاح للسحب: '+(Math.max(0,earned-used)/1000).toFixed(3)+' د.أ';$('history').replaceChildren(...w.data.map(x=>{const l=document.createElement('li');l.textContent=x.amount_fils/1000+' د.أ — '+x.status;return l;}));}$('login').onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('pass').value});if(error)return say(error.message);$('pass').value='';await load();};$('logout').onclick=async()=>{await db.auth.signOut();await load();};$('apply').onclick=async()=>{const{error}=await db.from('staff_applications').insert({user_id:user.id});say(error?error.message:'تم إرسال الطلب');await load();};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('link').value);say('تم النسخ');}catch{say('انسخ الرابط يدوياً');}};$('withdraw').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const{error}=await db.rpc('request_withdrawal',{p_amount:Math.round(Number($('amount').value)*1000),p_alias:$('alias').value.trim()});say(error?error.message:'تم إرسال طلب السحب');await load();}finally{b.disabled=false;}};await load();</script></html>
