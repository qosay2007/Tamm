<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمّ | طلب خدمة</title><style>body{background:#101114;font:16px system-ui;color:#f4f0e7;margin:0}main{max-width:520px;margin:20px auto;padding:24px;background:#1b1c21;border:1px solid #665333;border-radius:18px}input,textarea,button,select{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit;border:1px solid #665333;border-radius:9px;background:#111217;color:#f4f0e7}button{background:#171717;color:#e5bf65}a{color:#e5bf65}button[type=submit]{background:#d4af37;color:#171717;font-weight:bold}#items>div{padding:12px;border:1px solid #665333;border-radius:12px;margin:10px 0}</style><main><a href="/">العودة للخدمات</a><h1 id="title">طلب خدمة</h1><p id="price"></p><form id="form" hidden><label>اختر الباقة<select id="tier" style="width:100%;padding:14px;margin:8px 0" required></select></label><label>الاسم<input id="name" required minlength="2" maxlength="100" autocomplete="name"></label><label>رقم الهاتف<input id="phone" type="tel" required minlength="7" maxlength="25" autocomplete="tel"></label><div id="fields"></div><label id="detailsLabel">تفاصيل الطلب<textarea id="details" required maxlength="3000" rows="5"></textarea></label><p>سيتم مراجعة التحويل قبل اعتماد الدفع. لا ترسل بيانات بنكية أو كلمات مرور.</p><label style="display:flex;align-items:center;gap:10px"><input style="width:auto" type="checkbox" required> قرأت <a href="policies.html" target="_blank" rel="noopener">سياسات الخدمة</a> وأوافق عليها</label><button type="submit">إرسال الطلب</button></form><section id="payment" hidden><h2>الدفع عبر CliQ</h2><p>حوّل المبلغ الظاهر أعلاه إلى الحساب المختار، ثم أدخل مرجع التحويل.</p><form id="payform"><select id="cliq" aria-label="حساب CliQ" required style="width:100%;padding:12px"></select><input id="reference" aria-label="مرجع التحويل" required minlength="3" maxlength="150" placeholder="مرجع التحويل"><button>إرسال بيانات التحويل</button></form></section><p id="msg" role="status"></p><a id="tracking" hidden>متابعة الطلب</a></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9'),$=id=>document.getElementById(id),q=new URLSearchParams(location.search),id=q.get('service');const existing=q.get('order');
const incomingRef=q.get('ref');
if(incomingRef && /^[a-f0-9]{32}$/.test(incomingRef)) sessionStorage.setItem('tamm_ref', incomingRef);
function tracking(order){$('tracking').href='track.html?id='+encodeURIComponent(order);$('tracking').hidden=false;}async function openOrder(order) {
  const {data, error} = await db.rpc('track_guest_order', {p_order: order});
  const saved = data?.[0];
  if (error || !saved) {
    $('msg').textContent = 'تعذر تحميل الطلب. أعد المحاولة من صفحة المتابعة.';
    return;
  }
  tracking(order);
  $('price').textContent = saved.price_fils / 1000 + ' دينار أردني';

  if (saved.status === 'pending' && !saved.payment_submitted) {
    await payment(order);
  } else {
    $('msg').textContent += ' — تابع حالة الطلب من الرابط أدناه';
  }
}
if(existing){tracking(existing);await openOrder(existing);}else{const{data:s,error}=await db.from('services').select('id,title,price_fils').eq('id',id).eq('active',true).maybeSingle();if(error||!s){$('msg').textContent='الخدمة غير متاحة';}else{$('title').textContent=s.title;$('price').textContent=s.price_fils/1000+' دينار أردني';const tiers=[{tier:'basic',price_fils:s.price_fils}];const names={basic:'أساسية',advanced:'متقدمة',vip:'VIP'};$('tier').replaceChildren(...tiers.map(t=>{const o=document.createElement('option');o.value=t.tier;o.textContent=names[t.tier]+' — '+t.price_fils/1000+' دينار';return o;}));if(tiers.some(t=>t.tier===q.get('tier')))$('tier').value=q.get('tier');const showPrice=()=>{$('price').textContent=tiers.find(t=>t.tier===$('tier').value).price_fils/1000+' دينار أردني';};$('tier').onchange=showPrice;showPrice();const prompts={cv:'الاسم المهني، التعليم، الخبرات، المهارات، اللغات ووسائل التواصل',wedding:'أسماء العروسين، التاريخ، الساعة، المكان ونص الدعوة',birthday:'اسم صاحب المناسبة، التاريخ، الساعة، المكان ونص الدعوة',card:'اسم النشاط، المسمى، الهاتف، البريد وروابط التواصل',qr:'أدخل الرابط المطلوب فقط',links:'أدخل كل رابط HTTPS في سطر مستقل',website:'الاسم، نبذة، الخدمات، المشاريع وبيانات التواصل',menu:'كل صنف وسعره في سطر مستقل',catalog:'كل منتج ووصفه وسعره في سطر مستقل',certificate:'اسم المستفيد، سبب التكريم، الجهة المانحة والتاريخ'};$('details').placeholder=prompts[id]||'تفاصيل الخدمة';const schemas={cv:['الاسم الكامل','المسمى المهني','التعليم','الخبرات','المهارات','اللغات','وسائل التواصل'],wedding:['اسم العريس','اسم العروس','التاريخ','الساعة','المكان','نص الدعوة'],birthday:['اسم صاحب المناسبة','التاريخ','الساعة','المكان','نص الدعوة'],card:['اسم النشاط','المسمى','الهاتف','البريد الإلكتروني','روابط التواصل'],website:['اسم الموقع','نبذة','الخدمات','المشاريع','بيانات التواصل'],certificate:['اسم المستفيد','سبب التكريم','الجهة المانحة','التاريخ']};const fields=schemas[id]||[];const repeat=['menu','catalog','links'].includes(id);if(repeat){const area=document.createElement('div'),add=document.createElement('button');area.id='items';add.type='button';add.textContent=id==='links'?'إضافة رابط':'إضافة صنف أو منتج';const append=()=>{if(area.children.length>=15)return;const row=document.createElement('div');const labels=id==='links'?['اسم الرابط','الرابط HTTPS']:['الاسم','السعر بالدينار','الوصف'];for(const label of labels){const n=document.createElement('input');n.placeholder=label;n.maxLength=150;n.required=label!=='الوصف';if(label==='السعر بالدينار'){n.type='number';n.min='0';n.step='0.001';}if(label==='الرابط HTTPS')n.type='url';row.append(n);}const remove=document.createElement('button');remove.type='button';remove.textContent='حذف';remove.onclick=()=>{if(area.children.length>1)row.remove();};row.append(remove);area.append(row);};add.onclick=append;$('fields').append(area,add);append();$('detailsLabel').hidden=true;$('details').required=false;}for(const [i,label] of fields.entries()){const l=document.createElement('label'),input=document.createElement('input');input.maxLength=350;input.required=i===0;input.dataset.field=label;l.append(label,input);$('fields').append(l);}if(fields.length){$('detailsLabel').hidden=true;$('details').required=false;}$('form').hidden=false;$('form').onsubmit=async e=>{e.preventDefault();if(repeat){const rows=Array.from($('items').children).map(r=>Array.from(r.querySelectorAll('input')).map(n=>n.value.trim()));if(id==='links'&&rows.some(r=>!/^https:\/\//i.test(r[1]))){$('msg').textContent='أدخل روابط HTTPS صالحة';return;}$('details').value=rows.map(r=>id==='links'?r[0]+'\n'+r[1]:r[0]+' — '+r[1]+' د.أ'+(r[2]?' — '+r[2]:'')).join('\n');if($('details').value.length>3000){$('msg').textContent='اختصر التفاصيل إلى 3000 حرف';return;}}if(fields.length){$('details').value=Array.from($('fields').querySelectorAll('input')).filter(x=>x.value.trim()).map(x=>x.dataset.field+': '+x.value.trim()).join('\n');}if(!$('details').value.trim()||$('details').value.length>3000){$('msg').textContent='أدخل تفاصيل صحيحة لا تتجاوز 3000 حرف';return;}if(id==='qr'){if(new TextEncoder().encode($('details').value.trim()).length>2000){$('msg').textContent='اختصر الرابط ليتمكن النظام من إنشاء الرمز';return;}try{const u=new URL($('details').value.trim());if(!['https:','http:'].includes(u.protocol))throw Error();}catch{$('msg').textContent='أدخل رابط HTTP أو HTTPS صالحاً';return;}}const b=e.target.querySelector('button[type=submit]');b.disabled=true;try{const{data,error}=await db.rpc('submit_checkout_order',{p_service:id,p_name:$('name').value.trim(),p_phone:$('phone').value.trim(),p_details:$('details').value.trim(),p_ref:sessionStorage.getItem('tamm_ref')});if(error){$('msg').textContent='تعذر إرسال الطلب. تحقق من البيانات وحاول مجدداً.';return;}$('form').hidden=true;$('msg').textContent='تم استلام طلبك. احتفظ برقم الطلب: '+data;tracking(data);history.replaceState(null,'','order.html?order='+encodeURIComponent(data));await openOrder(data);}finally{b.disabled=false;}};}}async function payment(order){const{data,error}=await db.from('cliq_accounts').select('id,beneficiary,alias,is_default').eq('active',true).order('is_default',{ascending:false});if(error||!data?.length){$('msg').textContent+=' — الدفع غير متاح حالياً، انتظر التواصل من الإدارة.';return;}$('cliq').replaceChildren(...data.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.beneficiary+' — '+x.alias;return o;}));$('payment').hidden=false;$('payform').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const{error}=await db.rpc('submit_guest_payment',{p_order:order,p_account:$('cliq').value,p_reference:$('reference').value.trim()});if(error){
  $('payment').hidden=true;
  await openOrder(order);
  if (!$('payment').hidden) $('msg').textContent='تعذر تسجيل المرجع. تأكد من الحساب ومن أن المرجع لم يُستخدم في طلب آخر.';
  return;
}$('payment').hidden=true;$('msg').textContent='تم إرسال مرجع التحويل للمراجعة. رقم الطلب: '+order;}finally{b.disabled=false;}};}</script></html>
