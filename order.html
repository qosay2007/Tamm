<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمّ | طلب خدمة</title><style>body{background:#faf8f3;font:16px system-ui;color:#171717}main{max-width:520px;margin:30px auto;padding:24px;background:white;border-radius:18px}input,textarea,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;font:inherit;border:1px solid #ddd;border-radius:9px}button{background:#171717;color:#e5bf65}a{color:#755900}</style><main><a href="/">العودة للخدمات</a><h1 id="title">طلب خدمة</h1><p id="price"></p><form id="form" hidden><label>اختر الباقة<select id="tier" style="width:100%;padding:14px;margin:8px 0" required></select></label><label>الاسم<input id="name" required minlength="2" maxlength="100" autocomplete="name"></label><label>رقم الهاتف<input id="phone" type="tel" required minlength="7" maxlength="25" autocomplete="tel"></label><label>تفاصيل الطلب<textarea id="details" required maxlength="3000" rows="5"></textarea></label><p>سيتم مراجعة طلبك قبل الدفع. لا ترسل بيانات بنكية أو كلمات مرور.</p><button>إرسال الطلب</button></form><section id="payment" hidden><h2>الدفع عبر CliQ</h2><p>حوّل المبلغ الظاهر أعلاه إلى الحساب المختار، ثم أدخل مرجع التحويل.</p><form id="payform"><select id="cliq" required style="width:100%;padding:12px"></select><input id="reference" required minlength="3" maxlength="150" placeholder="مرجع التحويل"><button>إرسال بيانات التحويل</button></form></section><p id="msg" role="status"></p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9'),$=id=>document.getElementById(id),q=new URLSearchParams(location.search),id=q.get('service');const{data:s,error}=await db.from('services').select('id,title,price_fils').eq('id',id).maybeSingle();if(error||!s){$('msg').textContent='الخدمة غير متاحة';}else{$('title').textContent=s.title;$('price').textContent=s.price_fils/1000+' دينار أردني';const {data:packages,error:pe}=await db.from('service_packages').select('tier,price_fils').eq('service_id',id);const tiers=[{tier:'basic',price_fils:s.price_fils},...(pe?[]:(packages||[]).filter(t=>false))];const names={basic:'أساسية',advanced:'متقدمة',vip:'VIP'};$('tier').replaceChildren(...tiers.map(t=>{const o=document.createElement('option');o.value=t.tier;o.textContent=names[t.tier]+' — '+t.price_fils/1000+' دينار';return o;}));if(tiers.some(t=>t.tier===q.get('tier')))$('tier').value=q.get('tier');const showPrice=()=>{$('price').textContent=tiers.find(t=>t.tier===$('tier').value).price_fils/1000+' دينار أردني';};$('tier').onchange=showPrice;showPrice();const prompts={cv:'الاسم المهني، التعليم، الخبرات، المهارات، اللغات ووسائل التواصل',wedding:'أسماء العروسين، التاريخ، الساعة، المكان ونص الدعوة',birthday:'اسم صاحب المناسبة، التاريخ، الساعة، المكان ونص الدعوة',card:'اسم النشاط، المسمى، الهاتف، البريد وروابط التواصل',qr:'أدخل الرابط المطلوب فقط',links:'أدخل كل رابط HTTPS في سطر مستقل',website:'الاسم، نبذة، الخدمات، المشاريع وبيانات التواصل',menu:'كل صنف وسعره في سطر مستقل',catalog:'كل منتج ووصفه وسعره في سطر مستقل',certificate:'اسم المستفيد، سبب التكريم، الجهة المانحة والتاريخ'};$('details').placeholder=prompts[id]||'تفاصيل الخدمة';$('form').hidden=false;$('form').onsubmit=async e=>{e.preventDefault();if(id==='qr'){try{const u=new URL($('details').value.trim());if(!['https:','http:'].includes(u.protocol))throw Error();}catch{$('msg').textContent='أدخل رابط HTTP أو HTTPS صالحاً';return;}}const b=e.target.querySelector('button');b.disabled=true;try{const{data,error}=await db.rpc('submit_guest_order',{p_service:id,p_name:$('name').value.trim(),p_phone:$('phone').value.trim(),p_details:$('details').value.trim(),p_ref:q.get('ref')});if(error){$('msg').textContent='تعذر إرسال الطلب. تحقق من البيانات وحاول مجدداً.';return;}$('form').hidden=true;$('msg').textContent='تم استلام طلبك. احتفظ برقم الطلب: '+data;await payment(data);}finally{b.disabled=false;}};}async function payment(order){const{data,error}=await db.from('cliq_accounts').select('id,beneficiary,alias,is_default').eq('active',true).order('is_default',{ascending:false});if(error||!data.length){$('msg').textContent+=' — الدفع غير متاح حالياً، انتظر التواصل من الإدارة.';return;}$('cliq').replaceChildren(...data.map(x=>{const o=document.createElement('option');o.value=x.id;o.textContent=x.beneficiary+' — '+x.alias;return o;}));$('payment').hidden=false;$('payform').onsubmit=async e=>{e.preventDefault();const b=e.target.querySelector('button');b.disabled=true;try{const{error}=await db.rpc('submit_guest_payment',{p_order:order,p_account:$('cliq').value,p_reference:$('reference').value.trim()});if(error){$('msg').textContent='تعذر إرسال المرجع، رقم الطلب: '+order;return;}$('payment').hidden=true;$('msg').textContent='تم إرسال مرجع التحويل للمراجعة. رقم الطلب: '+order;}finally{b.disabled=false;}};}</script></html>
