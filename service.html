<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمّ | تفاصيل الخدمة</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 10%,#382718,transparent 45%),#090b10;color:#fff;font:16px system-ui}header,main,footer{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #665333}a{color:#eac16e;text-decoration:none}.hero{padding:35px 0;display:flex;align-items:center;gap:24px}.hero>div{flex:1}h1{font-size:clamp(30px,5vw,55px);color:#f6d28b;margin:10px 0}.mock{border:1px solid #b98b45;border-radius:24px;padding:35px;text-align:center;background:linear-gradient(145deg,#2b2117,#10141d);font-size:70px;box-shadow:0 0 40px #b98b4520}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}article{border:1px solid #665333;border-radius:18px;padding:20px;background:#15171d}article:nth-child(2){border-color:#9d855c}article:nth-child(3){border:2px solid #e9bd65;background:radial-gradient(ellipse at top,#49341c,#15171d 65%);box-shadow:0 0 24px #d8a74c30} .features{border:1px solid #665333;border-radius:20px;padding:20px;margin-bottom:28px;background:linear-gradient(110deg,#15171d,#211b15)}.features h2{color:#f6d28b}.featuregrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.featuregrid span:before{content:'✓ ';color:#f6d28b}.mock{position:relative;overflow:hidden}.mock:after{content:'';position:absolute;inset:10px;border:1px solid #d4af3744;border-radius:18px;pointer-events:none}strong{font-size:32px;color:#f1c875}.buy{display:block;background:#e8bb62;color:#111;text-align:center;padding:12px;border-radius:10px;margin-top:20px;font-weight:bold}p{line-height:1.8;color:#d4d1cb}footer{color:#d4b06c}@media(max-width:600px){.hero{flex-direction:column}.mock{width:100%;padding:20px}.grid{grid-template-columns:1fr}}</style><header><a href="/">تمّ | TAMM</a><a href="track.html">متابعة الطلب</a></header><main><section class="hero"><div><a href="/">جميع الخدمات</a><h1 id="title">تفاصيل الخدمة</h1><p id="desc"></p><p id="eta"></p></div><div class="mock" id="mock" aria-hidden="true"></div></section><section class="features"><h2>مميزات الخدمة</h2><div class="featuregrid" id="features"></div></section><h2>اختر الباقة المناسبة</h2><div class="grid" id="packages"></div><p id="msg" role="status"></p><p>الدفع عبر CliQ والتسليم بعد اعتماد التحويل. المدة تقديرية.</p></main><footer>اطلبها... واعتبرها تمّ.</footer><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9'),q=new URLSearchParams(location.search),id=q.get('service'),$=id=>document.getElementById(id);const meta={cv:['سيرة ذاتية مرتبة لعرض الخبرات والمهارات','📄',15],wedding:['دعوة رقمية بأسماء العروسين والموعد والمكان','💍',30],birthday:['دعوة رقمية للاحتفال بعيد الميلاد','🎂',15],card:['بطاقة رقمية لبيانات النشاط والتواصل','💳',15],qr:['رمز QR للرابط المطلوب','▦',5],links:['صفحة تجمع روابطك الشخصية','🔗',10],catalog:['عرض المنتجات ومعلوماتها','📚',30],menu:['قائمة رقمية للأصناف والأسعار','🍽',30],website:['صفحة تعريفية شخصية','▣',60],certificate:['شهادة رقمية بالاسم والمناسبة','🏅',10]};const{data:s,error}=await db.from('services').select('id,title,price_fils').eq('id',id).eq('active',true).maybeSingle();if(error||!s){$('msg').textContent='الخدمة غير متاحة';}else{const m=meta[id];$('title').textContent=s.title;$('desc').textContent=m[0];$('mock').textContent=m[1];const features={cv:['أقسام الخبرات والمهارات','تنسيق قابل للطباعة'],wedding:['أسماء العروسين','موعد ومكان الحفل'],birthday:['اسم صاحب المناسبة','موعد ومكان الحفل'],card:['بيانات النشاط','معلومات التواصل'],qr:['رمز لرابط تختاره','حفظ PNG'],links:['روابط قابلة للنقر','عرض على الهاتف'],catalog:['أسماء المنتجات','الأسعار والأوصاف'],menu:['الأصناف والأسعار','عرض رقمي'],website:['نبذة وخدمات','بيانات التواصل'],certificate:['اسم المستفيد','سبب التكريم']};for(const f of [...features[id],'استلام عبر صفحة المتابعة']){const span=document.createElement('span');span.textContent=f;$('features').append(span);}$('eta').textContent='مدة التسليم المستهدفة: '+m[2]+' دقيقة بعد اعتماد الدفع';const{data:p}=await db.from('service_packages').select('tier,price_fils').eq('service_id',id);for(const t of [{tier:'basic',price_fils:s.price_fils},...(p||[]).sort((a,b)=>a.tier.localeCompare(b.tier))]){const a=document.createElement('article'),h=document.createElement('h3'),price=document.createElement('strong'),d=document.createElement('p'),b=document.createElement('a');h.textContent=({basic:'أساسية',advanced:'متقدمة',vip:'VIP'})[t.tier];price.textContent=t.price_fils/1000+' د.أ';d.textContent=t.tier==='basic'?'قالب رقمي أساسي':'هذه الباقة قيد تطوير المزايا الإضافية';b.className='buy';const params=new URLSearchParams({service:id,tier:t.tier});if(q.get('ref'))params.set('ref',q.get('ref'));if(t.tier==='basic'){b.href='order.html?'+params;b.textContent='اطلب الآن';}else{b.textContent='قريباً';b.removeAttribute('href');}a.append(h,price,d,b);$('packages').append(a);}}</script><script>if(['birthday','wedding'].includes(new URLSearchParams(location.search).get('service'))){const section=document.createElement('section');section.style.cssText='margin:24px auto;max-width:900px;padding:16px';const h=document.createElement('h2');h.textContent='نماذج بصرية للدعوات';const img=document.createElement('img');img.src='a_collage_poster_grid_of_7_glossy_video_card_style.png';img.alt='نماذج تصاميم دعوات TAMM';img.style.cssText='width:100%;height:auto;border-radius:16px';const p=document.createElement('p');p.textContent='صور توضيحية ثابتة، وليست فيديوهات أو معاينة للمنتج النهائي.';section.append(h,img,p);document.querySelector('main')?.append(section);}</script></html>
