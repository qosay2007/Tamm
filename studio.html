<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استوديو تمّ</title><style>body{font:16px system-ui;background:#faf8f3;margin:24px;color:#222}main{max-width:800px;margin:auto}label{display:block;margin:12px 0}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border:1px solid #bbb;border-radius:8px;font:inherit}button{padding:12px;background:#171717;color:#fff;border:0;border-radius:8px}article{background:white;padding:32px;border-top:8px solid #b99140;margin:24px 0;white-space:pre-wrap;overflow-wrap:anywhere}@media print{form,nav,button,.notice{display:none}body{margin:0;background:white}article{border:0}}</style><main><nav><a href="index.html">الرئيسية</a></nav><h1>استوديو تمّ</h1><p class="notice">أداة مجانية محلية للمعاينة والطباعة، لا ترسل بياناتك إلى خادم ولا تنفذ طلبات مدفوعة.</p><form id="editor"><label>نوع الخدمة<select id="kind"><option>سيرة ذاتية</option><option>دعوة زفاف</option><option>دعوة عيد ميلاد</option><option>بطاقة أعمال</option><option>منيو مطعم</option><option>صفحة شخصية</option></select></label><label>الاسم أو العنوان<input id="heading" maxlength="120" required></label><label>العنوان الفرعي<input id="subtitle" maxlength="200"></label><label>التفاصيل (الخبرات، المناسبة، الأصناف والأسعار أو بيانات التواصل)<textarea id="details" rows="8" maxlength="8000"></textarea></label><button type="submit">تحديث المعاينة</button></form><article><h2 id="outTitle">معاينة الخدمة</h2><h3 id="outSub"></h3><p id="outBody"></p></article><button id="print">طباعة / حفظ PDF</button></main><script>const el=id=>document.getElementById(id);function render(){el('outTitle').textContent=el('heading').value||el('kind').value;el('outSub').textContent=el('subtitle').value;el('outBody').textContent=el('details').value}el('editor').addEventListener('submit',e=>{e.preventDefault();render()});el('editor').addEventListener('input',render);el('print').onclick=()=>{render();window.print()};</script></html>
