<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمّ | متابعة الطلب</title><style>body{background:#171717;color:white;font:16px system-ui}main{max-width:520px;margin:40px auto;padding:24px}input,button{box-sizing:border-box;width:100%;padding:14px;margin:8px 0;border-radius:8px;font:inherit}button{background:#d4af37;border:0}a,h1{color:#d4af37}</style><main><a href="/">الرئيسية</a><h1>متابعة الطلب</h1><form id="f"><input id="order" required placeholder="رقم الطلب الخاص بك"><button>متابعة</button></form><p id="result" role="status"></p><a id="delivery" hidden>استلام التصميم</a><p>احتفظ برقم الطلب ولا تشاركه مع الآخرين.</p></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9'),$=id=>document.getElementById(id);$('order').value=new URLSearchParams(location.search).get('id')||'';$('f').onsubmit=async e=>{e.preventDefault();const{data,error}=await db.rpc('track_guest_order',{p_order:$('order').value.trim()});const x=data?.[0];$('delivery').hidden=true;if(x&&['paid','fulfilled'].includes(x.status)&&['cv','certificate','birthday','wedding','card','links','website','menu','catalog'].includes(x.service_id)){$('delivery').href='delivery.html?id='+encodeURIComponent($('order').value.trim());$('delivery').hidden=false;}$('result').textContent=error||!x?'لم يتم العثور على الطلب':({pending:x.payment_submitted?'التحويل قيد المراجعة':'بانتظار الدفع',paid:'تم اعتماد الدفع — قيد التنفيذ',fulfilled:'تم إكمال الطلب',cancelled:'الطلب ملغى'}[x.status])+' | '+x.price_fils/1000+' د.أ';};if($('order').value)$('f').requestSubmit();</script></html>
