<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمّ | حساب العميل</title><style>body{background:#111;color:#fff;font:17px system-ui;margin:0}main{max-width:620px;margin:auto;padding:24px}section{background:#222;padding:20px;border-radius:16px;margin:16px 0}input,select,textarea,button{box-sizing:border-box;width:100%;padding:12px;margin:7px 0;border-radius:8px;font:inherit}button{background:#d4af37;border:0;cursor:pointer;color:#111}a,h1{color:#d4af37}label{display:block}li{padding:10px} [hidden]{display:none!important}</style><main><a href="./">الرئيسية</a><h1>تمّ | حساب العميل</h1><p id="msg" role="status" aria-live="polite"></p><section id="auth"><form id="login"><label>البريد الإلكتروني<input id="email" type="email" required autocomplete="email"></label><label>كلمة المرور<input id="password" type="password" required minlength="8" autocomplete="current-password"></label><button type="submit">تسجيل الدخول</button><button type="button" id="signup">إنشاء حساب</button></form></section><section id="customer" hidden><button id="logout">تسجيل الخروج</button><h2>طلب خدمة</h2><form id="order"><label>الخدمة<select id="service" required></select></label><label>تفاصيل الطلب<textarea id="details" maxlength="2000" required></textarea></label><button>إرسال الطلب</button></form><h2>طلباتي</h2><ul id="orders"></ul><p>الدفع غير متاح حالياً. إرسال الطلب لا يعني الدفع.</p></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9');const $=id=>document.getElementById(id);let catalog=[];const say=t=>$('msg').textContent=t;const fail=e=>say(e.message||'حدث خطأ');async function refresh(){const {data:{session},error}=await db.auth.getSession();if(error)return fail(error);$('auth').hidden=!!session;$('customer').hidden=!session;if(!session){$('orders').replaceChildren();return;}const {data,error:err}=await db.from('services').select('id,title,price_fils').order('title');if(err)return fail(err);catalog=data;$('service').replaceChildren(...data.map(s=>new Option(s.title+' — '+s.price_fils/1000+' د.أ',s.id)));const {data:orders,error:oe}=await db.from('orders').select('id,status,price_fils,service_id,created_at').eq('user_id',session.user.id).order('created_at',{ascending:false});if(oe)return fail(oe);$('orders').replaceChildren(...orders.map(o=>{const li=document.createElement('li');li.textContent=(catalog.find(s=>s.id===o.service_id)?.title||o.service_id)+' — '+o.price_fils/1000+' د.أ — '+({pending:'قيد الانتظار',paid:'مدفوع',fulfilled:'مكتمل',cancelled:'ملغى'}[o.status]||o.status);return li;}));}const creds=()=>({email:$('email').value.trim(),password:$('password').value});$('login').onsubmit=async e=>{e.preventDefault();const {error}=await db.auth.signInWithPassword(creds());if(error)return fail(error);say('تم تسجيل الدخول');await refresh();};$('signup').onclick=async()=>{if(!$('login').reportValidity())return;const {data,error}=await db.auth.signUp({...creds(),options:{emailRedirectTo:location.origin+'/account.html'}});if(error)return fail(error);say(data.session?'تم إنشاء الحساب':'راجع بريدك لتأكيد الحساب');await refresh();};$('logout').onclick=async()=>{const {error}=await db.auth.signOut();if(error)return fail(error);say('تم تسجيل الخروج');await refresh();};$('order').onsubmit=async e=>{e.preventDefault();const s=catalog.find(x=>x.id===$('service').value);if(!s)return;const b=e.target.querySelector('button');b.disabled=true;try{const {error}=await db.from('orders').insert({service_id:s.id,price_fils:s.price_fils,details:{text:$('details').value}});if(error)return fail(error);$('details').value='';say('تم إرسال الطلب');await refresh();}finally{b.disabled=false;}};await refresh();</script></html>
