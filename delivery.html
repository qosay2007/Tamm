ld strong{display:block;color:inherit;font-size:14px}.field{margin:12px 0}.field span{display:block} @media print{body{background:white}nav,#msg{display:none}main{padding:0}article{margin:0;break-inside:avoid;print-color-adjust:exact}}</style><main><nav><a href="/">تمّ</a> <button id="print" hidden>طباعة / حفظ PDF</button></nav><p id="msg" role="status">جاري تحميل التصميم...</p><article id="doc" hidden><h1 id="title"></h1><h2 id="name"></h2><div id="content"></div></article></main><script type="module">import QRCode from 'https://cdn.jsdelivr.net/npm/qrcode@1.5.4/+esm';import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9'),$=id=>document.getElementById(id),id=new URLSearchParams(location.search).get('id');const{data,error}=await db.rpc('get_generated_document',{p_order:id});const d=data?.[0];if(error||!d){$('msg').textContent='التصميم غير متاح بعد.';}else{$('title').textContent=({qr:'رمز QR',cv:'السيرة الذاتية',certificate:'شهادة تقدير',birthday:'دعوة عيد ميلاد',wedding:'دعوة زفاف',card:'بطاقة أعمال',links:'روابط شخصية',website:'موقع شخصي',menu:'قائمة الطعام',catalog:'كتالوج المنتجات'})[d.service_id];$('doc').classList.add(d.service_id);$('name').textContent='';$('content').textContent=d.content.text||'';if(['cv','certificate','birthday','wedding','card','website'].includes(d.service_id)){const rows=(d.content.text||'').split(/\n+/).filter(Boolean);const pairs=rows.map(line=>{const i=line.indexOf(': ');return i>0?[line.slice(0,i),line.slice(i+2)]:['',line];});const names={cv:['الاسم الكامل'],certificate:['اسم المستفيد'],birthday:['اسم صاحب المناسبة'],wedding:['اسم العريس','اسم العروس'],card:['اسم النشاط'],website:['اسم الموقع']};const heading=pairs.filter(p=>names[d.service_id].includes(p[0])).map(p=>p[1]).join(' و ');$('name').textContent=heading||'';$('content').replaceChildren(...pairs.filter(p=>!names[d.service_id].includes(p[0])).map(([k,v])=>{const div=document.createElement('div'),label=document.createElement('strong'),value=document.createElement('span');div.className='field';label.textContent=k;value.textContent=v;div.append(label,value);return div;}));}$('doc').classList.toggle('invite',['birthday','wedding'].includes(d.service_id));if(['links','menu','catalog'].includes(d.service_id)){const lines=(d.content.text||'').split(/\n+/).filter(Boolean);$('content').replaceChildren(...lines.map(line=>{const row=document.createElement('div');row.style.cssText='padding:12px;border-bottom:1px solid #c9ad70';const url=line.trim();if(d.service_id==='links'&&/^https:\/\//i.test(url)){const a=document.createElement('a');a.href=url;a.rel='noopener noreferrer';a.textContent=url;row.append(a);}else row.textContent=line;return row;}));}if(d.service_id==='qr'){const canvas=document.createElement('canvas');canvas.style.maxWidth='100%';try{await QRCode.toCanvas(canvas,d.content.text.trim(),{width:320,margin:4,errorCorrectionLevel:'M'});$('content').replaceChildren(canvas);const save=document.createElement('a');save.textContent='حفظ QR بصيغة PNG';save.download='TAMM-QR.png';save.href=canvas.toDataURL('image/png');$('content').append(document.createElement('br'),save);}catch{$('msg').textContent='تعذر إنشاء الرمز';throw new Error('QR generation failed');}}$('doc').hidden=false;$('print').hidden=false;$('msg').textContent='تصميم آلي من قالب TAMM';$('print').onclick=()=>window.print();}</script></html>
