<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمّ | حسابات الدفع</title><style>body{background:#151515;color:white;font:16px system-ui}main{max-width:650px;margin:auto;padding:20px}section,article{background:#252525;padding:16px;margin:12px 0;border-radius:12px}input,button{box-sizing:border-box;padding:12px;margin:5px 0;font:inherit;border-radius:8px}input{width:100%}button{background:#d4af37;border:0}a,h1{color:#d4af37}</style><main><a href="admin.html">العودة للإدارة</a><h1>حسابات CliQ</h1><p id="msg" role="status"></p><section id="panel" hidden><form id="add"><input id="beneficiary" placeholder="اسم المستفيد" required maxlength="100"><input id="alias" placeholder="CliQ Alias" required maxlength="100"><button>إضافة حساب</button></form><div id="accounts"></div></section></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9'),$=id=>document.getElementById(id),say=t=>$('msg').textContent=t;const{data:{user}}=await db.auth.getUser();const role=user?await db.from('staff_roles').select('role').eq('user_id',user.id).maybeSingle():null;if(role?.data?.role!=='admin'){say('سجل الدخول من لوحة الإدارة أولاً');}else{$('panel').hidden=false;await load();}async function load(){const{data,error}=await db.from('cliq_accounts').select('*').order('is_default',{ascending:false});if(error)return say(error.message);$('accounts').replaceChildren(...data.map(x=>{const a=document.createElement('article'),p=document.createElement('p');p.textContent=x.beneficiary+' — '+x.alias+' — '+(x.active?'نشط':'متوقف')+(x.is_default?' — افتراضي':'');a.append(p);for(const [label,fn] of [[x.active?'إيقاف':'تفعيل',()=>db.from('cliq_accounts').update({active:!x.active,is_default:false}).eq('id',x.id).select('id').single()],['تعيين افتراضي',()=>db.rpc('set_default_cliq',{p_id:x.id})]]){const b=document.createElement('button');b.textContent=label;b.disabled=label==='تعيين افتراضي'&&!x.active;b.onclick=async()=>{if(!confirm(label+'؟'))return;const{error}=await fn();say(error?error.message:'تم الحفظ');await load();};a.append(b);}return a;}));}$('add').onsubmit=async e=>{e.preventDefault();const{error}=await db.from('cliq_accounts').insert({beneficiary:$('beneficiary').value.trim(),alias:$('alias').value.trim()});say(error?error.message:'تمت الإضافة');if(!error)e.target.reset();await load();};</script></html>
