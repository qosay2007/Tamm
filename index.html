<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تمّ | الخدمات الرقمية</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 0 25%,#3b2815 0,transparent 30%),radial-gradient(ellipse at 100% 75%,#302113 0,transparent 28%),#090d16;color:#fff}header{display:flex;align-items:center;justify-content:space-between;padding:20px 5%;border-bottom:1px solid #ffffff20;background:#0b101a}header strong{font-size:28px;color:#ffd477}header a{background:linear-gradient(#ffe4a0,#e9a735);color:#111!important;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:bold}main{max-width:1150px;margin:auto;padding:22px}.hero{text-align:center;padding:36px 8px 48px;position:relative}.hero:after{content:'';position:absolute;bottom:22px;left:30%;width:40%;height:12px;border-top:3px solid #eebc5b;border-radius:50%}h1{font-size:clamp(28px,5vw,58px);margin:10px 0;color:white}h1 span{color:#ffc75f}.hero a{display:none}h2{font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{background:radial-gradient(ellipse at 25% 0,#47321c 0,transparent 65%),linear-gradient(145deg,#151923,#090c13);border:1px solid #76664e;border-radius:24px;padding:22px 10px;text-align:center;box-shadow:inset 0 -8px 20px #d9a34313,0 8px 20px #0005}article .symbol{font-size:clamp(40px,8vw,100px);display:block;filter:drop-shadow(0 5px 12px #ffbb5066);line-height:1.25}h3{font-size:clamp(15px,2.4vw,25px);margin:12px 0 18px}button{background:#090d16;color:#ffd477;border:2px solid #eab44f;padding:10px 16px;border-radius:30px;cursor:pointer;font:inherit;font-weight:bold}article button{width:94%;font-size:clamp(11px,1.8vw,17px)}dialog{background:#151923;color:white;border:1px solid #d6a64f;border-radius:20px;padding:26px;width:min(90%,480px)}dialog::backdrop{background:#000b}dialog a{display:block;background:#eab44f;color:#111;text-decoration:none;padding:12px;border-radius:10px;text-align:center;margin:16px 0}#price{color:#ffd477;font-size:24px}footer{padding:25px;text-align:center;border-top:1px solid #80602c;color:#ffd477}small{color:#b8b8bf}@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}article{padding:16px 6px;border-radius:18px}}</style></head><body><header><strong>تمّ | TAMM</strong> <a style="color:#e5bf65;float:left" href="account.html">حسابي</a></header><main><section class="hero"><h1>اطلبها... واعتبرها <span>تمّ</span>.</h1><a href="#services" style="color:#e5bf65">استكشف الخدمات</a></section><h2 id="services">خدماتنا</h2><div class="grid" id="catalog"></div><p><small>يمكن إرسال طلبك الآن. الدفع الإلكتروني والتسليم الآلي غير متاحين بعد.</small></p></main><footer>تمّ للخدمات الرقمية</footer><dialog id="details"><h2 id="service"></h2><p id="description"></p><p><strong id="price"></strong></p><a id="buy" href="account.html">اطلب الخدمة الآن</a> <button onclick="document.getElementById('details').close()">إغلاق</button></dialog><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9');const descriptions={cv:'سيرة ذاتية بتنسيق مرتب تشمل بياناتك وخبراتك ومهاراتك.',wedding:'دعوة زفاف رقمية بأسماء العروسين والموعد والمكان.',birthday:'دعوة رقمية لعيد الميلاد بالاسم والموعد والمكان.',card:'بطاقة أعمال رقمية ببيانات التواصل والنشاط.',qr:'رمز QR لرابط تختاره.',links:'صفحة تجمع روابط حساباتك وطرق التواصل.',catalog:'كتالوج رقمي لعرض المنتجات ومعلوماتها.',menu:'قائمة رقمية للأصناف والأسعار.',website:'موقع شخصي للتعريف بك وخدماتك.',certificate:'تصميم شهادة رقمية بالاسم والمناسبة.'};const el=id=>document.getElementById(id);const{data,error}=await db.from('services').select('id,title,price_fils').order('title');if(error){el('catalog').textContent='تعذر تحميل الخدمات. حاول مجدداً.';}else for(const s of data){const card=document.createElement('article'),title=document.createElement('h3'),b=document.createElement('button');title.textContent=s.title;b.textContent='التفاصيل والسعر';b.onclick=()=>{el('service').textContent=s.title;el('description').textContent=descriptions[s.id]||'';el('price').textContent='السعر: '+s.price_fils/1000+' دينار أردني';const q=new URLSearchParams({service:s.id});const ref=new URLSearchParams(location.search).get('ref');if(ref)q.set('ref',ref);el('buy').href='account.html?'+q;el('details').showModal();};const symbol=document.createElement('span');symbol.className='symbol';symbol.setAttribute('aria-hidden','true');symbol.textContent=({cv:'📄',wedding:'💍',birthday:'🎁',card:'💳',qr:'▦',links:'🔗',catalog:'📚',menu:'🍽️',website:'💻',certificate:'🏅'})[s.id]||'✦';card.append(symbol,title,b);el('catalog').append(card);}</script></body></html>
