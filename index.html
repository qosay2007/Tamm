<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تمّ | الخدمات الرقمية</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#faf8f3;color:#171717}header,footer{background:#181818;color:#e5bf65;padding:22px 6%}main{max-width:1100px;margin:auto;padding:24px}.hero{background:#181818;color:white;border-radius:24px;padding:48px 24px;text-align:center}h1{color:#e5bf65;font-size:42px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{background:white;border:1px solid #e7e0d0;border-radius:18px;padding:22px}button{background:#18201c;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}dialog{max-width:90%;border:0;border-radius:16px;padding:24px}input{display:block;width:100%;margin:12px 0;padding:12px}small{color:#665}</style></head><body><header><strong>تمّ | TAMM</strong></header><main><section class="hero"><h1>اطلبها... واعتبرها تمّ.</h1><p>خدمات رقمية للأفراد والأعمال في مكان واحد</p><a href="#services" style="color:#e5bf65">استكشف الخدمات</a></section><h2 id="services">خدماتنا</h2><div class="grid" id="catalog"></div><p><small>نسخة أولية للعرض فقط. الدفع وإرسال الطلبات غير مفعّلين.</small></p></main><footer>تمّ للخدمات الرقمية</footer><dialog id="details"><h2 id="service"></h2><p>هذه معاينة للخدمة. الطلب والدفع سيُفعّلان بعد ربط النظام الخلفي.</p><button onclick="document.getElementById('details').close()">إغلاق</button></dialog><script>const items=[['سيرة ذاتية',2],['دعوة زفاف',5],['دعوة عيد ميلاد',2],['بطاقة أعمال إلكترونية',3],['QR مخصص',1],['صفحة روابط شخصية',2],['كتالوج إلكتروني',5],['منيو إلكتروني',5],['موقع شخصي',10],['شهادة إلكترونية',1]];for(const [name,price] of items){const card=document.createElement('article');const title=document.createElement('h3');title.textContent=name;const p=document.createElement('p');p.textContent=price+' د.أ';const b=document.createElement('button');b.textContent='تفاصيل الخدمة';b.onclick=()=>{document.getElementById('service').textContent=name;document.getElementById('details').showModal()};card.append(title,p,b);document.getElementById('catalog').append(card)}</script></body></html>
