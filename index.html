<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تمّ | الخدمات الرقمية</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#faf8f3;color:#171717}header,footer{background:#181818;color:#e5bf65;padding:22px 6%}main{max-width:1100px;margin:auto;padding:24px}.hero{background:#181818;color:white;border-radius:24px;padding:48px 24px;text-align:center}h1{color:#e5bf65;font-size:42px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}article{background:white;border:1px solid #e7e0d0;border-radius:18px;padding:22px}button{background:#18201c;color:white;border:0;padding:12px 20px;border-radius:10px;cursor:pointer}dialog{max-width:90%;border:0;border-radius:16px;padding:24px}input{display:block;width:100%;margin:12px 0;padding:12px}small{color:#665}</style></head><body><header><strong>تمّ | TAMM</strong> <a style="color:#e5bf65;float:left" href="account.html">حسابي</a></header><main><section class="hero"><h1>اطلبها... واعتبرها تمّ.</h1><a href="#services" style="color:#e5bf65">استكشف الخدمات</a></section><h2 id="services">خدماتنا</h2><div class="grid" id="catalog"></div><p><small>يمكن إرسال طلبك الآن. الدفع الإلكتروني والتسليم الآلي غير متاحين بعد.</small></p></main><footer>تمّ للخدمات الرقمية</footer><dialog id="details"><h2 id="service"></h2><p id="description"></p><p><strong id="price"></strong></p><a id="buy" href="account.html">اطلب الخدمة الآن</a> <button onclick="document.getElementById('details').close()">إغلاق</button></dialog><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9');const descriptions={cv:'سيرة ذاتية بتنسيق مرتب تشمل بياناتك وخبراتك ومهاراتك.',wedding:'دعوة زفاف رقمية بأسماء العروسين والموعد والمكان.',birthday:'دعوة رقمية لعيد الميلاد بالاسم والموعد والمكان.',card:'بطاقة أعمال رقمية ببيانات التواصل والنشاط.',qr:'رمز QR لرابط تختاره.',links:'صفحة تجمع روابط حساباتك وطرق التواصل.',catalog:'كتالوج رقمي لعرض المنتجات ومعلوماتها.',menu:'قائمة رقمية للأصناف والأسعار.',website:'موقع شخصي للتعريف بك وخدماتك.',certificate:'تصميم شهادة رقمية بالاسم والمناسبة.'};const el=id=>document.getElementById(id);const{data,error}=await db.from('services').select('id,title,price_fils').order('title');if(error){el('catalog').textContent='تعذر تحميل الخدمات. حاول مجدداً.';}else for(const s of data){const card=document.createElement('article'),title=document.createElement('h3'),b=document.createElement('button');title.textContent=s.title;b.textContent='التفاصيل والسعر';b.onclick=()=>{el('service').textContent=s.title;el('description').textContent=descriptions[s.id]||'';el('price').textContent='السعر: '+s.price_fils/1000+' دينار أردني';const q=new URLSearchParams({service:s.id});const ref=new URLSearchParams(location.search).get('ref');if(ref)q.set('ref',ref);el('buy').href='account.html?'+q;el('details').showModal();};card.append(title,b);el('catalog').append(card);}</script></body></html>
