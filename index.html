<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>تمّ | الخدمات الرقمية</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:radial-gradient(ellipse at 0 25%,#3b2815 0,transparent 30%),radial-gradient(ellipse at 100% 75%,#302113 0,transparent 28%),#090d16;color:#fff}header{display:flex;align-items:center;justify-content:space-between;padding:20px 5%;border-bottom:1px solid #ffffff20;background:#0b101a}header strong{font-size:28px;color:#ffd477}header a{background:linear-gradient(#ffe4a0,#e9a735);color:#111!important;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:bold}main{max-width:1150px;margin:auto;padding:22px}.hero{text-align:center;padding:36px 8px 48px;position:relative}.hero:after{content:'';position:absolute;bottom:22px;left:30%;width:40%;height:12px;border-top:3px solid #eebc5b;border-radius:50%}h1{font-size:clamp(28px,5vw,58px);margin:10px 0;color:white}h1 span{color:#ffc75f}.hero a{display:none}h2{font-size:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}article{background:radial-gradient(ellipse at 25% 0,#47321c 0,transparent 65%),linear-gradient(145deg,#151923,#090c13);border:1px solid #76664e;border-radius:24px;padding:22px 10px;text-align:center;box-shadow:inset 0 -8px 20px #d9a34313,0 8px 20px #0005}article .symbol{font-size:clamp(40px,8vw,100px);display:block;filter:drop-shadow(0 5px 12px #ffbb5066);line-height:1.25}h3{font-size:clamp(15px,2.4vw,25px);margin:12px 0 18px}button{background:#090d16;color:#ffd477;border:2px solid #eab44f;padding:10px 16px;border-radius:30px;cursor:pointer;font:inherit;font-weight:bold}article button{width:94%;font-size:clamp(11px,1.8vw,17px)}dialog{background:#151923;color:white;border:1px solid #d6a64f;border-radius:20px;padding:26px;width:min(90%,480px)}dialog::backdrop{background:#000b}dialog a{display:block;background:#eab44f;color:#111;text-decoration:none;padding:12px;border-radius:10px;text-align:center;margin:16px 0}#price{color:#ffd477;font-size:24px}footer{padding:25px;text-align:center;border-top:1px solid #80602c;color:#ffd477}small{color:#b8b8bf}@media(max-width:600px){main{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}article{padding:16px 6px;border-radius:18px}}.symbol svg{width:100%;max-width:135px;height:auto;filter:drop-shadow(0 3px 1px #8a511b) drop-shadow(0 0 10px #eab44f66)}body{background-image:radial-gradient(ellipse at 0 25%,#3b2815 0,transparent 30%),radial-gradient(ellipse at 100% 75%,#302113 0,transparent 28%),repeating-linear-gradient(165deg,transparent 0 22px,#c9953910 23px,transparent 24px 38px)} </style></head><body><header><strong>تمّ | TAMM</strong> <a style="float:left;color:#e5bf65" href="track.html">متابعة الطلب</a></header><main><section class="hero"><h1>اطلبها... واعتبرها <span>تمّ</span>.</h1><a href="#services" style="color:#e5bf65">استكشف الخدمات</a></section><h2 id="services">خدماتنا</h2><div class="grid" id="catalog"></div><p><small>الدفع عبر CliQ بعد الطلب، والتسليم بعد مراجعة التحويل.</small></p></main><footer>تمّ للخدمات الرقمية</footer><dialog id="details"><h2 id="service"></h2><p id="description"></p><p id="eta"></p><p><strong id="price"></strong></p><div id="packages"></div><a id="buy" href="order.html">اطلب الخدمة الآن</a> <button onclick="document.getElementById('details').close()">إغلاق</button></dialog><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9');const descriptions={cv:'سيرة ذاتية بتنسيق مرتب تشمل بياناتك وخبراتك ومهاراتك.',wedding:'دعوة زفاف رقمية بأسماء العروسين والموعد والمكان.',birthday:'دعوة رقمية لعيد الميلاد بالاسم والموعد والمكان.',card:'بطاقة أعمال رقمية ببيانات التواصل والنشاط.',qr:'رمز QR لرابط تختاره.',links:'صفحة تجمع روابط حساباتك وطرق التواصل.',catalog:'كتالوج رقمي لعرض المنتجات ومعلوماتها.',menu:'قائمة رقمية للأصناف والأسعار.',website:'موقع شخصي للتعريف بك وخدماتك.',certificate:'تصميم شهادة رقمية بالاسم والمناسبة.'};const el=id=>document.getElementById(id);const{data,error}=await db.from('services').select('id,title,price_fils').order('title');if(error){el('catalog').textContent='تعذر تحميل الخدمات. حاول مجدداً.';}else for(const s of data){const card=document.createElement('article'),title=document.createElement('h3'),b=document.createElement('button');title.textContent=s.title;b.textContent='التفاصيل والسعر';b.onclick=async()=>{el('service').textContent=s.title;el('description').textContent=descriptions[s.id]||'';el('eta').textContent='مدة التسليم المستهدفة بعد اعتماد الدفع: '+({cv:15,wedding:30,birthday:15,card:15,qr:5,links:10,catalog:30,menu:30,website:60,certificate:10}[s.id]||30)+' دقيقة (تقديرية)';el('price').textContent='السعر: '+s.price_fils/1000+' دينار أردني';const q=new URLSearchParams({service:s.id});const ref=new URLSearchParams(location.search).get('ref');if(ref)q.set('ref',ref);el('buy').href='order.html?'+q;el('packages').replaceChildren();el('details').showModal();const {data:ps}=await db.from('service_packages').select('tier,price_fils').eq('service_id',s.id);if(el('service').textContent!==s.title)return;for(const t of [{tier:'basic',price_fils:s.price_fils},...(ps||[])]){const link=document.createElement('a');const params=new URLSearchParams(q);params.set('tier',t.tier);link.href='order.html?'+params;link.textContent=({basic:'أساسية',advanced:'متقدمة',vip:'VIP'})[t.tier]+' — '+t.price_fils/1000+' دينار';el('packages').append(link);}};const symbol=document.createElement('span');symbol.className='symbol';symbol.setAttribute('aria-hidden','true');symbol.innerHTML='<svg viewBox="0 0 120 100" aria-hidden="true"><g fill="none" stroke="#f7c66a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">'+({"cv":"<rect x=\"30\" y=\"12\" width=\"60\" height=\"76\" rx=\"8\"/><path d=\"M42 35h36M42 48h36M42 61h26\"/>","wedding":"<circle cx=\"45\" cy=\"58\" r=\"24\"/><circle cx=\"77\" cy=\"58\" r=\"24\"/><path d=\"m32 27 13-15 13 15-13 12z\"/>","birthday":"<rect x=\"20\" y=\"40\" width=\"80\" height=\"48\" rx=\"5\"/><path d=\"M15 40h90V28H15zM60 28v60M60 28C20 24 32 0 60 28C88 0 100 24 60 28\"/>","card":"<rect x=\"12\" y=\"23\" width=\"96\" height=\"60\" rx=\"9\"/><circle cx=\"36\" cy=\"43\" r=\"9\"/><path d=\"M23 67q13-25 26 0M62 42h32M62 54h25M62 66h30\"/>","qr":"<path d=\"M20 35V15h20M80 15h20v20M100 65v20H80M40 85H20V65\"/><rect x=\"30\" y=\"25\" width=\"18\" height=\"18\"/><rect x=\"72\" y=\"25\" width=\"18\" height=\"18\"/><rect x=\"30\" y=\"57\" width=\"18\" height=\"18\"/><path d=\"M60 25v20h10M60 57h30v18H72V64M60 75v10\"/>","links":"<rect x=\"15\" y=\"15\" width=\"90\" height=\"70\" rx=\"9\"/><circle cx=\"42\" cy=\"40\" r=\"10\"/><path d=\"M26 66q16-27 32 0M70 35h20M70 47h20M68 76l25-25\"/>","catalog":"<path d=\"M60 25Q35 10 15 25v60q25-15 45 0 20-15 45 0V25Q85 10 60 25v60M25 38h23M25 50h23M72 38h23M72 50h23\"/>","menu":"<rect x=\"25\" y=\"10\" width=\"70\" height=\"80\" rx=\"8\"/><path d=\"M40 25h40M40 42h40M40 58h40M40 74h25\"/>","website":"<rect x=\"12\" y=\"15\" width=\"96\" height=\"70\" rx=\"8\"/><path d=\"M12 32h96M25 46h40v25H25zM76 46h20M76 58h20M76 70h20\"/>","certificate":"<rect x=\"12\" y=\"15\" width=\"96\" height=\"65\" rx=\"5\"/><path d=\"M28 32h64M28 45h48M28 58h36M76 72l-5 20 12-7 12 7-5-20\"/><circle cx=\"83\" cy=\"64\" r=\"12\"/>"}[s.id]||'')+'</g></svg>';card.append(symbol,title,b);el('catalog').append(card);}</script></body></html>
