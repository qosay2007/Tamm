<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تمّ | الإدارة</title><style>body{background:#111;color:#eee;font:16px system-ui;margin:0}main{max-width:1000px;margin:auto;padding:24px}section{background:#222;padding:20px;border-radius:14px;margin:16px 0}input,button,select{font:inherit;padding:10px;border-radius:8px;margin:5px;max-width:100%;box-sizing:border-box}button{background:#d4af37;border:0;cursor:pointer}h1,h2,a{color:#d4af37}article{border-bottom:1px solid #555;padding:12px;overflow-wrap:anywhere}[hidden]{display:none!important}</style><main><h1>تمّ | لوحة الإدارة</h1><p id="msg" role="status"></p><section id="auth"><form id="login"><input id="email" type="email" placeholder="البريد الإلكتروني" required autocomplete="email"><input id="password" type="password" placeholder="كلمة المرور" required autocomplete="current-password"><button>دخول الإدارة</button></form></section><button id="logout" hidden>خروج</button><div id="panel" hidden><section><a href="payments-admin.html">إدارة حسابات CliQ</a></section><section><h2>الطلبات</h2><p id="stats"></p><input id="search" placeholder="بحث برقم الطلب أو الخدمة"><div id="orders"></div></section><section><h2>إدارة الخدمات والأسعار</h2><div id="services"></div></section><section><h2>طلبات الموظفين</h2><div id="applications"></div></section><section><h2>طلبات السحب</h2><div id="withdrawals"></div></section></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://coydxucjwjpzlkzsujvz.supabase.co','sb_publishable_woh5NjzRRHhXB0K2vtOMnQ_SKYhdHP9');const $=id=>document.getElementById(id),say=t=>$('msg').textContent=t;let orders=[];const statuses={pending:'قيد الانتظار',paid:'مدفوع',fulfilled:'مكتمل',cancelled:'ملغى'};function render(){const q=$('search').value.toLowerCase();$('orders').replaceChildren(...orders.filter(o=>(o.id+' '+o.service_id).toLowerCase().includes(q)).map(o=>{const a=document.createElement('article'),p=document.createElement('p'),s=document.createElement('select'),b=document.createElement('button');p.textContent=o.id+' | '+o.service_id+' | '+o.price_fils/1000+' د.أ | '+(o.details?.text||'')+' | العميل: '+(o.details?.name||'')+' | الهاتف: '+(o.details?.phone||'')+' | مرجع التحويل: '+(o.payment_reference||'لم يرسل')+' | حساب الدفع: '+(o.cliq_account_id||'—');s.replaceChildren(...Object.entries(statuses).filter(([k])=>k===o.status||(o.status==='pending'&&['paid','cancelled'].includes(k))||(o.status==='paid'&&k==='fulfilled')).map(([k,v])=>new Option(v,k,false,k===o.status)));b.textContent='حفظ الحالة';b.onclick=async()=>{if(!confirm('تأكيد تعديل حالة الطلب؟'))return;const{error}=await db.from('orders').update({status:s.value}).eq('id',o.id).select('id').single();say(error?error.message:'تم الحفظ');await load();};a.append(p,s,b);return a;}));}async function load(){const{data:{session}}=await db.auth.getSession();$('panel').hidden=true;$('auth').hidden=!!session;$('logout').hidden=!session;if(!session)return;const{data:role,error}=await db.from('staff_roles').select('role').eq('user_id',session.user.id).maybeSingle();if(error||role?.role!=='admin'){say('هذا الحساب لا يملك صلاحية الإدارة');return;}$('panel').hidden=false;await staffLoad();const r=await db.from('orders').select('*').order('created_at',{ascending:false}).limit(100);if(r.error)return say(r.error.message);orders=r.data;$('stats').textContent='آخر '+orders.length+' طلب — بانتظار الدفع: '+orders.filter(o=>o.status==='pending').length;render();const c=await db.from('services').select('*').order('title');if(c.error)return say(c.error.message);$('services').replaceChildren(...c.data.map(x=>{const a=document.createElement('article'),t=document.createElement('span'),n=document.createElement('input'),l=document.createElement('label'),v=document.createElement('input'),b=document.createElement('button');t.textContent=x.title;n.type='number';n.min='0.001';n.step='0.001';n.value=x.price_fils/1000;n.setAttribute('aria-label','السعر بالدينار');v.type='checkbox';v.checked=x.active;l.append(v,'متاحة');b.textContent='حفظ';b.onclick=async()=>{const price=Math.round(Number(n.value)*1000);if(!Number.isSafeInteger(price)||price<1)return say('سعر غير صالح');const{error}=await db.from('services').update({price_fils:price,active:v.checked}).eq('id',x.id).select('id').single();say(error?error.message:'تم حفظ الخدمة');};a.append(t,n,l,b);return a;}));}async function staffLoad(){const a=await db.from('staff_applications').select('*').order('created_at',{ascending:false});if(a.error)return say(a.error.message);$('applications').replaceChildren(...a.data.map(x=>{const d=document.createElement('article');d.textContent=x.user_id+' — '+x.status;if(x.status==='pending'){const b=document.createElement('button');b.textContent='قبول مسوق';b.onclick=async()=>{const{error}=await db.rpc('approve_marketer',{p_user:x.user_id});say(error?error.message:'تم القبول');await staffLoad();};d.append(b);}return d;}));const w=await db.from('withdrawals').select('*').order('created_at',{ascending:false});if(w.error)return say(w.error.message);$('withdrawals').replaceChildren(...w.data.map(x=>{const d=document.createElement('article');d.textContent=x.user_id+' — '+x.amount_fils/1000+' د.أ — '+x.cliq_alias+' — '+x.status;if(x.status==='pending')for(const [v,t] of [['paid','تم التحويل فعلياً'],['rejected','رفض']]){const b=document.createElement('button');b.textContent=t;b.onclick=async()=>{if(!confirm('تأكيد '+t+'؟'))return;const{error}=await db.from('withdrawals').update({status:v}).eq('id',x.id).select('id').single();say(error?error.message:'تم الحفظ');await staffLoad();};d.append(b);}return d;}));}$('search').oninput=render;$('login').onsubmit=async e=>{e.preventDefault();const{error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return say(error.message);$('password').value='';say('');await load();};$('logout').onclick=async()=>{await db.auth.signOut();orders=[];$('orders').replaceChildren();$('services').replaceChildren();say('');await load();};await load();</script></html>
