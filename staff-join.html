<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <title>تمّ | تفعيل دعوة الموظف</title>
  <style>
    :root{color-scheme:dark;--bg:#090a0c;--panel:#171614;--line:#594a30;--gold:#e9b943;--gold2:#ffdb75;--muted:#c8c1b4}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;padding:24px 14px 40px;background:radial-gradient(ellipse at 90% 0%,#7a541b20,transparent 32%),var(--bg);color:#f6f3ec;font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{width:min(100%,620px);margin:5vh auto}.brand{color:var(--gold2);font-weight:900;text-decoration:none;font-size:23px}.brand small{display:block;font-size:12px;letter-spacing:.2em}.card{margin-top:18px;padding:clamp(18px,5vw,32px);border:1px solid var(--line);border-radius:24px;background:linear-gradient(145deg,#1d1a15,#121315);box-shadow:0 20px 55px #0007}.card h1{margin:0;color:var(--gold2);font-size:clamp(22px,5vw,30px)}.muted{color:var(--muted)}label{display:block;margin:14px 0 5px}input{width:100%;min-height:48px;padding:11px 13px;border:1px solid #5a4d35;border-radius:12px;background:#0d0e10;color:#fff;font:inherit}button,.button{display:block;width:100%;margin-top:16px;padding:13px 16px;border:0;border-radius:12px;background:linear-gradient(135deg,#ffdb75,#d9a32c);color:#17120a;text-align:center;font:700 16px system-ui;cursor:pointer;text-decoration:none}button:disabled{opacity:.6;cursor:wait}.secondary{margin-top:9px;border:1px solid #695631;background:#121315;color:var(--gold2)}.box{margin-top:15px;padding:14px;border:1px solid #54482f;border-radius:14px;background:#111214}.notice{min-height:1.6em;color:var(--gold2)}[hidden]{display:none!important}
  </style>
</head>
<body>
  <main>
    <a class="brand" href="./">تمّ <small>TAMM</small></a>
    <section class="card">
      <h1>تفعيل دعوة الموظف</h1>
      <p class="muted">أنشئ حسابك ببريد الدعوة نفسه، أكّد البريد من الرسالة التي تصلك، ثم فعّل عضويتك. صلاحية الموظف يحددها المدير ولا يمكنك اختيار دور إداري.</p>
      <p id="msg" class="notice" role="status" aria-live="polite"></p>
      <form id="signupForm">
        <label for="signupEmail">البريد الإلكتروني</label><input id="signupEmail" type="email" autocomplete="email" maxlength="254" required>
        <label for="signupPassword">كلمة المرور</label><input id="signupPassword" type="password" autocomplete="new-password" minlength="8" required>
        <label for="confirmPassword">تأكيد كلمة المرور</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required>
        <button type="submit">إنشاء الحساب</button>
      </form>
      <form id="loginForm" class="box">
        <strong>لديك حساب مؤكد مسبقاً؟</strong>
        <label for="loginEmail">البريد الإلكتروني</label><input id="loginEmail" type="email" autocomplete="email" maxlength="254" required>
        <label for="loginPassword">كلمة المرور</label><input id="loginPassword" type="password" autocomplete="current-password" required>
        <button class="secondary" type="submit">تسجيل الدخول بهذا البريد</button>
      </form>
      <div id="activateBox" class="box" hidden>
        <p id="signedEmail" class="muted"></p>
        <button id="activate" type="button">تفعيل عضويتي</button>
      </div>
      <a id="staffLink" class="button" href="staff.html" hidden>فتح لوحة الموظفين</a>
    </section>
  </main>
  <script type="module" src="./assets/staff-join.js?v=20261128-invite1"></script>
</body>
</html>
